<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e8edf9">
  <title>Go Home Time</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.20260611-glass.svg">
  <link rel="preload" href="/fonts/plus-jakarta-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/styles.20260618-cols.css">
</head>
<body>
  <div class="backdrop" aria-hidden="true">
    <div class="blob blob-a"></div>
    <div class="blob blob-b"></div>
    <div class="blob blob-c"></div>
    <div class="blob blob-d"></div>
  </div>

  <main class="page">
    <header class="hero">
      <div class="hero-top">
        <p class="greeting">
          <span class="person-dot" aria-hidden="true"></span>
          Good workday!
        </p>
        <p id="today-date" class="date-chip">Today</p>
      </div>
      <h1>Your <span>go-home time</span></h1>
    </header>

    <section class="panel answer" aria-live="polite" aria-atomic="true">
      <span class="answer-label">Leave at</span>
      <output id="leave-time" for="arrival">18:15</output>
      <p class="answer-countdown">
        <span>Countdown</span>
        <strong id="countdown-time" data-countdown-output>--:--:--</strong>
      </p>
      <div class="answer-notify">
        <button id="notify-toggle" type="button" aria-pressed="false" aria-label="Toggle go-home notifications">
          <span class="notify-dot" aria-hidden="true"></span>
          <span id="notify-label">Notify me</span>
        </button>
        <span id="notify-status" class="notify-status" aria-live="polite"></span>
      </div>
      <p id="status-message">A 09:00 check-in maps to an 18:15 leave time.</p>
    </section>

    <div class="layout">
    <form id="person-form" class="panel input-area">
      <div class="field-block">
        <label for="person-select">Person</label>
        <select id="person-select" name="person"></select>
      </div>

      <div id="new-person-fields" class="new-person-fields">
        <label for="person-name">New person name</label>
        <input id="person-name" name="name" type="text" autocomplete="name" maxlength="40" placeholder="nghiaph">
      </div>

      <section class="time-card" aria-labelledby="arrival-label">
        <div class="field-heading">
          <label id="arrival-label" for="arrival">Come in</label>
          <button id="now-button" type="button">Now</button>
        </div>
        <input id="arrival" name="arrival" type="time" min="08:30" max="09:30" step="60" value="09:00">
        <div class="preset-row" aria-label="Common check-in times">
          <button type="button" data-time="08:30">08:30</button>
          <button type="button" data-time="09:00">09:00</button>
          <button type="button" data-time="09:30">09:30</button>
        </div>
      </section>

      <button id="save-button" type="submit">Save today</button>
    </form>

    <section class="panel board" aria-labelledby="board-title">
      <div class="board-head">
        <div>
          <p class="kicker">Team</p>
          <h2 id="board-title">Who leaves when</h2>
        </div>
        <div class="board-actions">
          <a class="dashboard-link" href="/dashboard">Dashboard</a>
          <button id="refresh-button" type="button">Refresh</button>
        </div>
      </div>
      <ul id="people-list" class="people-list" aria-live="polite" aria-atomic="true"></ul>
      <p id="board-status" class="board-status">Loading board...</p>
    </section>
    </div>
  </main>

  <script src="/script.20260618-min.js" defer></script>
</body>
</html>
